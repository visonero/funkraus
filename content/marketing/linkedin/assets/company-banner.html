<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1128px;height:191px;overflow:hidden;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(480px 300px at 92% 100%, rgba(34,211,238,0.20), transparent 62%),
      linear-gradient(155deg, #0a2140 0%, #103a6c 50%, #175ea3 100%);
    color:#fff;
    position:relative;
  }
  .grid-lines {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(620px 260px at 78% 20%, rgba(0,0,0,0.9), transparent 75%);
  }

  /* The square company logo overlaps roughly this bottom-left zone — kept clear on purpose. */
  .content{ position:absolute; right:40px; top:50%; transform:translateY(-50%); text-align:right; z-index:1; max-width:760px; }
  .tag{
    display:inline-flex; align-items:center; gap:7px; font-family:'Poppins',sans-serif; font-weight:700;
    font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase; color:#8fe0ff;
  }
  .tag .dot{ width:6px; height:6px; border-radius:50%; background:#22d3ee; }
  h1{
    margin:9px 0 0; font-family:'Poppins',sans-serif; font-weight:800; font-size:29px; line-height:1.22;
    color:#fff; text-wrap:balance;
  }
  h1 .accent{ background:linear-gradient(95deg,#7fd9ff,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid-lines"></div>

  <div class="content">
    <span class="tag"><span class="dot"></span>Online-Kurs für BZF I &amp; II</span>
    <h1>Wir bauen die <span class="accent">Zukunft der Sprechfunk-Ausbildung.</span></h1>
  </div>
</body></html>
