<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1200px;height:627px;overflow:hidden;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(560px 420px at 84% 8%, rgba(34,211,238,0.22), transparent 62%),
      linear-gradient(160deg, #0a2140 0%, #103a6c 48%, #175ea3 100%);
    color:#fff;
    position:relative;
  }
  .grid-lines {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 75%);
  }

  .logo{ position:absolute; top:52px; left:64px; display:flex; align-items:center; gap:12px; }
  .logo span{ font-family:'Poppins',sans-serif; font-weight:800; font-size:26px; color:#fff; letter-spacing:-0.01em; }

  .content{ position:relative; z-index:1; padding:150px 64px 0; max-width:920px; }
  h1{
    margin:0; font-family:'Poppins',sans-serif; font-weight:800; font-size:56px; line-height:1.16;
    color:#fff; text-wrap:balance;
  }
  h1 .accent{ background:linear-gradient(95deg,#7fd9ff,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub{
    margin:22px 0 0; font-size:21px; line-height:1.55; color:rgba(255,255,255,0.82); max-width:680px; font-weight:500;
  }

  .chips{ position:absolute; left:64px; right:64px; bottom:56px; display:flex; gap:14px; z-index:1; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22);
    border-radius:12px; padding:14px 20px;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:#22d3ee; flex:none; }
  .chip b{ font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; color:#fff; }
  .chip span{ font-size:13px; color:rgba(255,255,255,0.68); }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid-lines"></div>

  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
      <circle cx="10" cy="30" r="3.4" fill="#5fc3ff" />
      <path d="M16 24 A11 11 0 0 1 27 13" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M13.5 27.2 A15.5 15.5 0 0 1 29.2 11.5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M11 29.8 A19.8 19.8 0 0 1 31.8 9" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" />
    </svg>
    <span>funkraus</span>
  </div>

  <div class="content">
    <h1>Sprechfunk-Ausbildung, <span class="accent">neu gedacht.</span></h1>
    <p class="sub">BZF I &amp; II als kompletter Online-Kurs — mit einem KI-Tower, der dich wirklich sprechen lässt.</p>
  </div>

  <div class="chips">
    <div class="chip"><span class="dot"></span><b>261</b><span>Prüfungsfragen</span></div>
    <div class="chip"><span class="dot"></span><b>12</b><span>Module, BZF I &amp; II</span></div>
    <div class="chip"><span class="dot"></span><b>KI-Tower</b><span>Live-Funktraining</span></div>
  </div>
</body></html>
