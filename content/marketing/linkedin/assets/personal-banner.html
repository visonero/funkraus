<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1584px;height:396px;overflow:hidden;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(620px 460px at 90% 100%, rgba(34,211,238,0.20), transparent 62%),
      linear-gradient(155deg, #0a2140 0%, #103a6c 50%, #175ea3 100%);
    color:#fff;
    position:relative;
  }
  .grid-lines {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(900px 500px at 75% 30%, rgba(0,0,0,0.9), transparent 75%);
  }

  /* Profile photo overlaps roughly this zone (bottom-left) — kept clear on purpose. */
  .safe-guide{ position:absolute; left:0; bottom:0; width:300px; height:300px; }

  .logo{ position:absolute; top:36px; left:48px; display:flex; align-items:center; gap:10px; z-index:1; }
  .logo span{ font-family:'Poppins',sans-serif; font-weight:800; font-size:21px; color:#fff; letter-spacing:-0.01em; }

  .content{ position:absolute; right:56px; top:50%; transform:translateY(-50%); text-align:right; z-index:1; max-width:980px; }
  .role{
    display:inline-flex; align-items:center; gap:8px; font-family:'Poppins',sans-serif; font-weight:700;
    font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:#8fe0ff;
  }
  .role .dot{ width:7px; height:7px; border-radius:50%; background:#22d3ee; }
  h1{
    margin:14px 0 0; font-family:'Poppins',sans-serif; font-weight:800; font-size:42px; line-height:1.2;
    color:#fff; text-wrap:balance;
  }
  h1 .accent{ background:linear-gradient(95deg,#7fd9ff,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub{
    margin:14px 0 0; font-size:18px; line-height:1.5; color:rgba(255,255,255,0.8); font-weight:500;
  }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid-lines"></div>

  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
      <circle cx="10" cy="30" r="3.4" fill="#5fc3ff" />
      <path d="M16 24 A11 11 0 0 1 27 13" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M13.5 27.2 A15.5 15.5 0 0 1 29.2 11.5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M11 29.8 A19.8 19.8 0 0 1 31.8 9" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" />
    </svg>
    <span>funkraus</span>
  </div>

  <div class="content">
    <span class="role"><span class="dot"></span>Gründer, funkraus</span>
    <h1>Ich baue die <span class="accent">Zukunft der Sprechfunk-Ausbildung.</span></h1>
    <p class="sub">BZF I &amp; II online lernen, mit einem KI-Tower zum echten Sprechfunk-Training.</p>
  </div>
</body></html>
