<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1920px;height:1080px;overflow:hidden;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(900px 640px at 50% 30%, rgba(34,211,238,0.16), transparent 62%),
      linear-gradient(160deg, #0a2140 0%, #103a6c 50%, #175ea3 100%);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .grid-lines {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(1100px 700px at 50% 35%, rgba(0,0,0,0.85), transparent 78%);
  }
  .wrap{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; max-width:1400px; }
  .logo{ display:flex; align-items:center; gap:14px; }
  .logo span{ font-family:'Poppins',sans-serif; font-weight:800; font-size:38px; color:#fff; letter-spacing:-0.01em; }

  h1{
    margin:44px 0 0; font-family:'Poppins',sans-serif; font-weight:800; font-size:64px; line-height:1.2; color:#fff;
  }
  h1 .accent{ background:linear-gradient(95deg,#7fd9ff,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .url-box{
    margin-top:38px; display:inline-flex; align-items:center; gap:14px;
    background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.28);
    padding:20px 40px; border-radius:999px;
  }
  .url-box span{ font-family:'Poppins',sans-serif; font-weight:700; font-size:34px; color:#fff; }
  p.sub{ margin:26px 0 0; font-size:26px; color:rgba(255,255,255,0.78); font-weight:500; }

  .cta-row{ margin-top:56px; display:flex; align-items:center; gap:16px; }
  .bell{
    width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
  }
  .cta-row p{ font-size:24px; font-weight:600; color:rgba(255,255,255,0.85); }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid-lines"></div>
  <div class="wrap">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 40 40" fill="none">
        <circle cx="10" cy="30" r="3.4" fill="#5fc3ff" />
        <path d="M16 24 A11 11 0 0 1 27 13" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
        <path d="M13.5 27.2 A15.5 15.5 0 0 1 29.2 11.5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
        <path d="M11 29.8 A19.8 19.8 0 0 1 31.8 9" stroke="#5fc3ff" stroke-width="3" stroke-linecap="round" fill="none" />
      </svg>
      <span>funkraus</span>
    </div>

    <h1>Jetzt kostenlos <span class="accent">starten.</span></h1>
    <p class="sub">Die ersten 2 Module sind kostenlos — ohne Zahlungsdaten.</p>

    <div class="url-box">
      <span>www.funkraus.de</span>
    </div>

    <div class="cta-row">
      <div class="bell">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <p>Abonniere für mehr Sprechfunk-Tipps</p>
    </div>
  </div>
</body></html>
